x-airflow-common: &airflow-common
  build: .
  image: nyc311-airflow:latest
  user: "${AIRFLOW_UID}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    PYTHONPATH: /opt/airflow/src
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./spark_jobs:/opt/airflow/spark_jobs
    - ./data:/opt/airflow/data
    - ./notebooks:/opt/airflow/notebooks
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow                          # Airflow's metadata DB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d # creates the nyc311 DB on first start
    ports:
      - "5433:5432"                                 # host:container (5433 avoids clashing with a local Postgres)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # One-shot job: set up Airflow's tables and the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  jupyter:
    <<: *airflow-common
    command:
      - bash
      - -c
      - |
        python -m ipykernel install --user --name nyc311 --display-name "Python (NYC 311)"
        exec jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --ServerApp.root_dir=/opt/airflow/notebooks
    ports:
      - "127.0.0.1:8888:8888"
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs: